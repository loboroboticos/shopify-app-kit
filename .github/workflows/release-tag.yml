name: release-tag

# Tags a release on merge. When main moves, read the plugin version; if refs/tags/v<version> does not exist,
# create an annotated tag on the pushed commit, push it, and publish a GitHub Release whose notes are that
# version's CHANGELOG section. An existing tag is a no-op, so running on every push to main is cheap and
# never misses a bump. Nobody pushes a kit tag by hand (skills/kit-dev).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: tag v<plugin version> and publish the release
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (the tag is the trailing comment); .github/dependabot.yml bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read the plugin version
        id: version
        run: |
          set -euo pipefail
          version="$(jq -r .version .claude-plugin/plugin.json)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::plugin.json version '$version' is not X.Y.Z"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create and push the tag unless it exists
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin; nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "shopify-app-kit $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Created $TAG at $GITHUB_SHA."
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Extract the CHANGELOG section
        if: steps.tag.outputs.created == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="$VERSION" '
            $0 == "## " v { p = 1; next }
            /^## / { p = 0 }
            p
          ' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "shopify-app-kit $VERSION (no CHANGELOG section found for this version)." > release-notes.md
          fi
          echo "Release notes:"; cat release-notes.md

      - name: Publish the GitHub Release
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is."
            exit 0
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "shopify-app-kit $TAG" --notes-file release-notes.md --verify-tag
