name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests, plugin validation, version bump
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (the tag is the trailing comment); .github/dependabot.yml bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Unit tests (node:test, zero dependencies)
        run: node --test "test/**/*.test.mjs"

      - name: Install the Claude Code CLI
        run: |
          # One retry for a flaky registry; a second failure fails the job, so the validators below always run.
          npm i -g @anthropic-ai/claude-code || { sleep 15; npm i -g @anthropic-ai/claude-code; }
          claude --version

      - name: claude plugin validate . --strict
        run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate skills --strict

      - name: Version bump check (PRs to main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          changed="$(git diff --name-only "origin/main...HEAD" -- skills agents hooks workflows schemas lessons .claude-plugin || true)"
          # A routine added, removed or renamed changes what the doctor finds beside it; a prompt edit alone does not.
          routines="$(git diff --name-only --diff-filter=ADR "origin/main...HEAD" -- 'routines/*.md' || true)"
          changed="$(printf '%s\n%s\n' "$changed" "$routines" | grep . || true)"
          if [ -z "$changed" ]; then
            echo "No plugin-visible files changed and no routine was added, removed or renamed; no version bump required."
            exit 0
          fi
          echo "Files that need a version bump:"; printf '  %s\n' $changed
          head_version="$(jq -r .version .claude-plugin/plugin.json)"
          base_version="$(git show origin/main:.claude-plugin/plugin.json 2>/dev/null | jq -r .version 2>/dev/null || echo '<none>')"
          echo "origin/main version: $base_version; this PR: $head_version"
          if [ "$head_version" = "$base_version" ]; then
            echo "::error file=.claude-plugin/plugin.json::skills/, agents/, hooks/, workflows/, schemas/, lessons/ or .claude-plugin/ changed, or a routine was added, removed or renamed, but the plugin version did not. Bump .claude-plugin/plugin.json (and the '# shopify-app-kit vX.Y.Z' hook headers) and add a CHANGELOG entry."
            exit 1
          fi

  # A consumer on a stock Mac runs the guards with /bin/bash 3.2 and BSD sed. The runner's Homebrew bash would
  # shadow /bin/bash, so it goes first on PATH and the step fails unless 3.2 is the bash the tests spawn.
  hooks-bash-3-2:
    name: hook tests under macOS /bin/bash 3.2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: test/hooks.test.mjs with /bin/bash 3.2 and BSD sed
        run: |
          mkdir -p "$RUNNER_TEMP/bash-3.2" && ln -sf /bin/bash "$RUNNER_TEMP/bash-3.2/bash"
          export PATH="$RUNNER_TEMP/bash-3.2:$PATH"
          bash -c 'case "$BASH_VERSION" in 3.2.*) echo "bash $BASH_VERSION" ;; *) echo "::error::expected bash 3.2, got $BASH_VERSION"; exit 1 ;; esac'
          command -v jq >/dev/null || brew install jq
          node --test test/hooks.test.mjs
