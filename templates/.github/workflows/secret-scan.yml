# .github/workflows/secret-scan.yml (shopify-app-kit template)
# Gitleaks over the full git history on every PR and weekly over every ref. The binary is a version-pinned
# release tarball whose SHA-256 is verified before it runs (the gitleaks-action needs a licence for
# organisations; the binary does not). Rules and allowlists live in .gitleaks.toml.
#
# Fill {{GITLEAKS_VERSION}} and {{GITLEAKS_SHA256}} once: open the release page for the version you pin, take
# the linux_x64 tarball's line from its checksums.txt, and paste both here. Dependabot does not bump these;
# bump them deliberately, re-reading the checksum each time.
name: secret-scan

on:
  pull_request:
  schedule:
    # Off the hour: the platform delays and drops runs that pile up at minute 0. No other schedule in this
    # repo shares this minute. GitHub disables scheduled workflows after 60 days without a commit to the
    # repository; a liveness tripwire (the ops ritual) lists every schedule: workflow so the silence is noticed.
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks over the full history
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA (the tag is the trailing comment); .github/dependabot.yml bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history and every ref: a secret committed and then removed is still in the history.
          fetch-depth: 0

      - name: Download gitleaks and verify its checksum
        env:
          GITLEAKS_VERSION: '{{GITLEAKS_VERSION}}'
          GITLEAKS_SHA256: '{{GITLEAKS_SHA256}}'
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # --redact keeps the matched secret out of the job log. --log-opts=--all scans every ref, not only the
      # checked-out branch, so a weekly run on the default branch still covers stale feature branches.
      # (The `git` subcommand needs gitleaks 8.19 or newer; older releases spell it `detect --source .`.)
      - name: Scan
        run: gitleaks git --config .gitleaks.toml --redact --exit-code 1 --log-opts=--all .
